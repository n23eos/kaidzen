domain: "универсальный"
rubric:
  novelty: "Новизна: насколько идея отличается от уже существующих решений. Оценивай по найденным аналогам: если аналог делает то же самое тем же способом — низко; если отличие есть, но только в подаче — средне; если отличается сам механизм или связка компонентов — высоко."
  feasibility: "Реализуемость: можно ли воплотить идею силами автора за разумное время и с разумными ресурсами. Учитывай технические, юридические и организационные препятствия, названные в реестре допущений. Идея, требующая недоступного ресурса, не может получить выше 4."
  groundedness: "Обоснованность: доля high-допущений, закрытых фактами с источниками (confirmed или refuted), от общего числа high-допущений. 0 закрытых — 0–2; половина — около 5; все закрытые фактами со ссылками — 9–10. Untestable не считается закрытым."
  potential: "Потенциал: ценность результата, если идея сработает. Сколько людей и насколько сильно выиграют, и сохранится ли эффект. Мелкое удобство для узкого круга — низко; заметное улучшение для большой группы — высоко."
  clarity: "Ясность: понятна ли формулировка стороннему человеку с первого прочтения. Проверяй, названы ли явно проблема, аудитория и механизм, нет ли расплывчатых слов вместо конкретики."
researcher_focus: "существующие аналоги, факты за и против ключевых допущений"
analyzer_hints: ""
loop:
  max_iterations: 6
  plateau_threshold: 0.5
  assumptions_per_iteration: 3
models:
  analyzer: claude-sonnet-5
  researcher: claude-sonnet-5
  refiner: claude-sonnet-5
  judge: claude-sonnet-5
