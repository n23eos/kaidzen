domain: "компьютерные игры"
rubric:
  mechanics: "Механика: новизна и увлекательность основной игровой петли. Оценивай именно петлю (что игрок делает раз за разом и почему повторяет), а не сеттинг и не сюжет. Петля не описана явно — не выше 3; описана, но повторяет петлю известного аналога один в один — 4–6; есть работающий и объяснимый новый элемент — 7 и выше."
  audience: "Аудитория: существует ли и достижима ли аудитория жанра. Оценивай по найденным данным о жанре: числу игроков, продажам и отзывам аналогов. Аудитория задана как «все, кто любит игры» — не выше 3. Высоко только там, где назван конкретный жанровый сегмент с подтверждённым спросом."
  groundedness: "Обоснованность: доля high-допущений, закрытых фактами с источниками (confirmed или refuted), от общего числа high-допущений. 0 закрытых — 0–2; половина — около 5; все закрыты фактами со ссылками — 9–10. Untestable не считается закрытым."
  scope: "Сложность разработки: реалистичен ли объём для заявленной команды и срока. Учитывай число систем, объём контента, требования к арту, сетевой код, платформы. Идея, требующая большой команды при её отсутствии, не может получить выше 4."
  potential: "Потенциал: перспективы против аналогов жанра. Есть ли причина выбрать эту игру, а не уже вышедшую и отполированную. Учитывай найденные тренды жанра и типичные причины провалов."
researcher_focus: "аналоги в Steam, отзывы и продажи жанра, тренды, типичные провалы жанра"
analyzer_hints: "выдели core loop, жанр и ближайшие аналоги"
loop:
  max_iterations: 6
  plateau_threshold: 0.5
  assumptions_per_iteration: 3
models:
  analyzer: claude-sonnet-5
  researcher: claude-sonnet-5
  refiner: claude-sonnet-5
  judge: claude-sonnet-5
