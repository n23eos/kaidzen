domain: бизнес-идеи
rubric:
  market: 'Рынок: размер и достижимость целевой аудитории. Оценивай по найденным данным
    о числе платящих и их бюджете, а не по общей величине отрасли. Аудитория не названа
    конкретно — не выше 3; названа, но без подтверждённого спроса — 4–6; есть данные
    о числе и платёжеспособности — 7 и выше.'
  competition: 'Конкуренция: есть ли незанятая позиция против существующих игроков.
    Проверяй по найденным прямым конкурентам: если новый продукт делает то же по той
    же цене для тех же людей — не выше 3. Высоко только там, где отличие названо явно
    и его трудно скопировать за месяц.'
  groundedness: 'Обоснованность: доля high-допущений, закрытых фактами с источниками
    (confirmed или refuted), от общего числа high-допущений. 0 закрытых — 0–2; половина
    — около 5; все закрыты фактами со ссылками — 9–10. Untestable не считается закрытым.'
  monetization: 'Монетизация: понятен ли и реалистичен способ заработка. Должны быть
    названы: кто платит, за что, сколько и как часто. Цена, не сопоставленная с ценами
    конкурентов и со стоимостью привлечения клиента, не может дать выше 5.'
  feasibility: 'Реализуемость: можно ли запустить силами автора за разумное время
    и деньги. Учитывай стартовые затраты, регуляторные требования, зависимость от
    партнёров и поставщиков. Идея, требующая недоступного ресурса или лицензии, не
    может получить выше 4.'
researcher_focus: 'Приоритет обхода: (1) high-допущения без единого факта — минимум
  2 поиска на каждое; (2) medium-допущения без фактов; (3) только потом добор фактов
  по допущениям, у которых вердикт уже вынесен. Предмет поиска: прямые конкуренты
  и их прайсы, достижимый размер сегмента, стоимость привлечения клиента, регуляторные
  требования. Независимый источник ценнее материала продавца услуги.'
analyzer_hints: особое внимание монетизации и каналам привлечения
loop:
  max_iterations: 6
  plateau_threshold: 2.0
  assumptions_per_iteration: 3
backends:
  subscription:
    type: claude_agent_sdk
roles:
  analyzer:
    backend: subscription
    model: claude-sonnet-5
  researcher:
    backend: subscription
    model: claude-sonnet-5
  refiner:
    backend: subscription
    model: claude-sonnet-5
  judge:
    backend: subscription
    model: claude-sonnet-5
  reporter:
    backend: subscription
    model: claude-sonnet-5
